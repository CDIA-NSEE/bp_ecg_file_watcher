[project]
name = "bp_ecg_file_watcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4.0",
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "Pillow>=10.0",
    "blake3>=0.4",
    "zstandard>=0.22",
    "boto3>=1.34",
    "structlog>=24.0",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.20",
    "peewee>=3.17",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "moto[s3]>=5.0",
    "ruff>=0.4",
    "pyrefly>=0.1",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bp_ecg_watcher"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
]

[tool.pyrefly]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
