[project]
name = "bp_ecg_file_watcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "Pillow>=10.0",
    "blake3>=0.4",
    "zstandard>=0.22",
    "structlog>=24.0",
    "pydantic-settings>=2.0",
    "dask[distributed]>=2024.1",
    "dask-jobqueue>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
    "pyrefly>=0.1",
    "reportlab>=4.0",
    "taskipy>=1.12",
    "bandit[toml]>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bp_ecg_watcher"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
]

[tool.pyrefly]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.taskipy.tasks]
run        = { cmd = "python -m bp_ecg_watcher.main",                  help = "Run the watcher locally (requires .env)" }
lint       = { cmd = "ruff check .",                                   help = "Run ruff linter" }
fmt        = { cmd = "ruff format .",                                  help = "Auto-format with ruff" }
fmt-check  = { cmd = "ruff format --check .",                          help = "Check formatting (no writes)" }
typecheck  = { cmd = "pyrefly check .",                                        help = "Run pyrefly type checker" }
bandit     = { cmd = "bandit -r src/ -c pyproject.toml",               help = "Run Bandit SAST" }
test       = { cmd = "pytest",                                         help = "Run test suite" }
ci         = { cmd = "task lint && task fmt-check && task typecheck && task bandit && task test", help = "Full CI gate" }
