[project]
name = "pdf-watcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4.0.0",
    "structlog>=24.0.0",
    "pypdf>=4.0.0",
    "zstandard>=0.22.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
pdf-watcher = "pdf_watcher.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["ruff>=0.4.0", "pyrefly>=0.1.0", "taskipy>=1.12.0"]

[tool.taskipy.tasks]
run    = "python -m pdf_watcher.main"
lint   = "ruff check src/"
format = "ruff format src/"
check  = "pyrefly check src/"
dev    = "task lint && task check && task run"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_watcher"]
