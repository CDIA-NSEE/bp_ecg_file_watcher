services:
  init-permissions:
    image: busybox
    user: root
    command: ["sh", "-c", "chmod -R 777 /data/dedup /data/output"]
    volumes:
      - ./data/output:/data/output
      - ./data/dedup:/data/dedup

  dask-scheduler:
    build: .
    command: ["/app/.venv/bin/dask", "scheduler"]
    ports:
      - "8786:8786"   # TCP scheduler port
      - "8787:8787"   # Dashboard
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8786)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 6

  dask-worker:
    build: .
    command:
      - "/app/.venv/bin/dask"
      - "worker"
      - "tcp://dask-scheduler:8786"
      - "--nthreads=1"
    environment:
      - DEDUP_DIRECTORY=/data/dedup
    volumes:
      - ./data/incoming:/data/incoming:ro
      - ./data/output:/data/output
      - ./data/dedup:/data/dedup
    depends_on:
      dask-scheduler:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
    deploy:
      replicas: 3

  app:
    build: .
    command: ["python", "-m", "bp_ecg_watcher.main"]
    environment:
      - DEDUP_DIRECTORY=/data/dedup
      - DASK_SCHEDULER=tcp://dask-scheduler:8786
      - INPUT_DIRECTORY=/data/incoming
      - OUTPUT_DIRECTORY=/data/output
      - LOG_LEVEL=INFO
      - ENVIRONMENT=dev
    volumes:
      - ./data/incoming:/data/incoming:ro
      - ./data/output:/data/output
      - ./data/dedup:/data/dedup
    depends_on:
      dask-scheduler:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
