services:
  dask-scheduler:
    build: .
    command: ["/app/.venv/bin/dask", "scheduler"]
    ports:
      - "8786:8786"   # TCP scheduler port
      - "8787:8787"   # Dashboard
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8786)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 6

  dask-worker:
    build: .
    command:
      - "/app/.venv/bin/dask"
      - "worker"
      - "tcp://dask-scheduler:8786"
      - "--nthreads=1"
      - "--nprocs=1"
    environment:
      - DEDUP_DIRECTORY=/data/dedup
    volumes:
      - ./data/incoming:/data/incoming:ro
      - ./data/output:/data/output
      - ./data/dedup:/data/dedup
    depends_on:
      dask-scheduler:
        condition: service_healthy
    deploy:
      replicas: 3

